name: test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: dotnet build ApplePeripheralsForWindows.sln -c Release
      - run: dotnet run --project src/MagicTrackpad.App/MagicTrackpad.App.csproj -c Release -- --self-test
      - run: python -m unittest discover -s tests
      - shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $script.FullName), [ref]$errors)
            if ($errors) {
              $errors | Format-List
              throw "PowerShell parser errors in $($script.Name)."
            }
          }
